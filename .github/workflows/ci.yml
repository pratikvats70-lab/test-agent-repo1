name: Spring Boot CI

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: chmod +x gradlew

      - run: ./gradlew test

      - run: ./gradlew build